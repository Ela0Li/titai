<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<style>
 body{background:#0d1117;color:#e6edf3;font:15px/1.9 -apple-system,"Segoe UI",system-ui,sans-serif;padding:24px 28px;max-width:760px}
 .case{border:1px solid #1f2730;background:#11161d;border-radius:8px;padding:10px 14px;margin:8px 0}
 .cap{color:#7d8590;font-size:12px;margin:12px 0 2px}
 code{background:#161b22;border:1px solid #222a33;border-radius:4px;padding:1px 5px;font-size:13px}
 math{font-size:1.06em}

 .eqblock{margin:10px 0;overflow-x:auto}
</style></head><body>
<h3 style="color:#7ee787;font-size:15px">math.js 排版核对</h3>
<div class="cap">行内分式</div><div class="case"><math display="inline"><mrow><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac></mrow></math></div>
<div class="cap">方差</div><div class="case"><math display="inline"><mrow><msup><mi>σ</mi><mrow><mn>2</mn></mrow></msup><mo>=</mo><mfrac><mrow><munderover><mrow><mo>∑</mo></mrow><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>n</mi></mrow></munderover><mo>(</mo><msub><mi>x</mi><mrow><mi>i</mi></mrow></msub><mo>-</mo><mi>μ</mi><msup><mo>)</mo><mrow><mn>2</mn></mrow></msup></mrow><mrow><mi>n</mi><mo>-</mo><mn>1</mn></mrow></mfrac></mrow></math></div>
<div class="cap">带括号上标</div><div class="case"><math display="inline"><mrow><msup><mrow><mo stretchy="true">(</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mi>b</mi></mrow></mfrac><mo stretchy="true">)</mo></mrow><mrow><mn>2</mn></mrow></msup></mrow></math></div>
<div class="cap">根号</div><div class="case"><math display="inline"><mrow><msqrt><mrow><mfrac><mrow><mn>1</mn></mrow><mrow><mi>m</mi></mrow></mfrac></mrow></msqrt></mrow></math></div>
<div class="cap">偏导</div><div class="case"><math display="inline"><mrow><mfrac><mrow><mo>∂</mo><mi>L</mi></mrow><mrow><mo>∂</mo><msub><mi>w</mi><mrow><mi>j</mi></mrow></msub></mrow></mfrac><mo>=</mo><mi>η</mi><mo>·</mo><mo>∇</mo><mi>L</mi></mrow></math></div>
<div class="cap">复杂度</div><div class="case"><math display="inline"><mrow><mi>O</mi><mo>(</mo><mi>n</mi><mo>log</mo><mo>&#x2061;</mo><mi>n</mi><mo>)</mo></mrow></math></div>
<div class="cap">比较符</div><div class="case"><math display="inline"><mrow><mi>α</mi><mo>≤</mo><mi>β</mi><mo>≠</mo><mi>γ</mi></mrow></math></div>
<div class="cap">中文夹排</div><div class="case"><math display="inline"><mrow><mtext>学习率</mtext><mi>η</mi><mo>=</mo><mn>0.001</mn></mrow></math></div>
<div class="cap">负指数</div><div class="case"><math display="inline"><mrow><msup><mn>10</mn><mrow><mo>-</mo><mn>3</mn></mrow></msup></mrow></math></div>
<div class="cap">argmax</div><div class="case"><math display="inline"><mrow><munder><mrow><mo>arg max</mo><mo>&#x2061;</mo></mrow><mrow><mi>θ</mi></mrow></munder><msub><mo>∑</mo><mrow><mi>i</mi></mrow></msub><mo>log</mo><mo>&#x2061;</mo><mi>p</mi><mo>(</mo><msub><mi>x</mi><mrow><mi>i</mi></mrow></msub><mo>|</mo><mi>θ</mi><mo>)</mo></mrow></math></div>
<div class="cap">矩阵式连乘</div><div class="case"><math display="inline"><mrow><munderover><mrow><mo>∏</mo></mrow><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mrow><mi>K</mi></mrow></munderover><msub><mi>σ</mi><mrow><mi>k</mi></mrow></msub></mrow></math></div>
<div class="cap">积分</div><div class="case"><math display="inline"><mrow><msubsup><mo>∫</mo><mrow><mn>0</mn></mrow><mrow><mn>1</mn></mrow></msubsup><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mspace width="0.17em"/><mi>d</mi><mi>x</mi></mrow></math></div>
<div class="cap">不认识的命令</div><div class="case"><math display="inline"><mrow><mtext>\foobar</mtext><mi>x</mi></mrow></math></div>
<div class="cap">单独美元符</div><div class="case"><math display="inline"><mrow><mo>价</mo><mo>格</mo><mo>$</mo><mn>5</mn><mo>和</mo><mo>$</mo><mn>6</mn></mrow></math></div>
<div class="cap">混排（段落内）</div><div class="case">学习率取 <math display="inline"><mrow><mi>η</mi><mo>=</mo><mn>0.001</mn></mrow></math> 时，<math display="block"><mrow><mi>Δ</mi><mi>w</mi><mo>=</mo><mo>-</mo><mi>η</mi><mo>∇</mo><mi>L</mi></mrow></math> 约为 1e-4；代码里写 <code>reserve()</code> 不受影响。</div>
</body></html>
